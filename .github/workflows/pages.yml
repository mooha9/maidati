name: نشر مائدتي إلى GitHub Pages (الإنتاج + التجربة)
on:
  push:
    branches: [main, staging]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: الإنتاج (main)
        uses: actions/checkout@v4
        with: { ref: main, path: main }
      - name: التجربة (staging)
        continue-on-error: true
        uses: actions/checkout@v4
        with: { ref: staging, path: stg }
      - name: البناء
        run: |
          python3 main/build.py --env production --out site
          if [ -f stg/build.py ]; then python3 stg/build.py --env staging --out site/staging; fi
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
