<title>مائدتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: mobile-first app shell — sticky header, one scrolling view, bottom tab bar. Olive (the plan's staple) + fig (its sweet) on a sage-tinted ground. */
:root{
  --bg:#F1F4EC; --surface:#FFFFFF; --sunk:#E8EDE1; --ink:#1B261D; --muted:#5B685D; --line:#D8E0D1;
  --olive:#3E5E29; --olive-ink:#FFFFFF; --olive-soft:#E1EBD3;
  --fig:#7A3455; --fig-soft:#F4E3EB;
  --ok:#2C7A47; --ok-soft:#DDF0E3; --warn:#A96C12; --warn-soft:#FBEBCD; --bad:#B2362D; --bad-soft:#F9E0DD;
  --shadow:0 1px 2px rgba(27,38,29,.06),0 6px 20px rgba(27,38,29,.06);
  --f-display:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1510; --surface:#182019; --sunk:#131A14; --ink:#E6ECE3; --muted:#9AA79B; --line:#2A352B;
  --olive:#9CC37B; --olive-ink:#11200A; --olive-soft:#223019;
  --fig:#E79CBF; --fig-soft:#3A2230;
  --ok:#6FCB8E; --ok-soft:#173222; --warn:#E6B45C; --warn-soft:#3A2C12; --bad:#F2887E; --bad-soft:#3C1C19;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1510; --surface:#182019; --sunk:#131A14; --ink:#E6ECE3; --muted:#9AA79B; --line:#2A352B;
  --olive:#9CC37B; --olive-ink:#11200A; --olive-soft:#223019;
  --fig:#E79CBF; --fig-soft:#3A2230;
  --ok:#6FCB8E; --ok-soft:#173222; --warn:#E6B45C; --warn-soft:#3A2C12; --bad:#F2887E; --bad-soft:#3C1C19;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--fig);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.35;margin:0;text-wrap:balance}
.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 110px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid transparent}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.mark{width:38px;height:38px;border-radius:12px;background:var(--olive);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
.brand h1{font-size:20px}
.brand small{display:block;color:var(--muted);font-size:12px;font-family:var(--f-body)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:currentColor}

/* tab bar */
.tabs{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
.tab{background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);border-radius:12px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab[aria-selected="true"]{color:var(--olive);font-weight:600}
.tab[aria-selected="true"] .pip{background:var(--olive-soft)}
.pip{padding:3px 16px;border-radius:99px;display:grid;place-items:center}

.view{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.label{font-size:12px;letter-spacing:.02em;color:var(--muted);font-weight:500}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}

/* now card */
.now{background:var(--olive);color:var(--olive-ink);border:0;position:relative;overflow:hidden}
.now .label{color:inherit;opacity:.8}
.now h2{font-size:24px;margin-top:2px}
.now .count{font-family:var(--f-display);font-size:14px;opacity:.9}
.now-steps{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.now-step{display:flex;gap:10px;align-items:baseline;background:rgba(255,255,255,.12);border-radius:10px;padding:8px 10px;font-size:14px}
:root[data-theme="dark"] .now-step{background:rgba(0,0,0,.12)}
.now-step b{font-family:var(--f-display);font-weight:600;min-width:74px;font-size:13px;opacity:.85}
.now .btns{margin-top:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 14px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--olive);color:var(--olive-ink);border-color:var(--olive)}
.btn.fig{background:var(--fig);color:var(--surface);border-color:var(--fig)}
.btn.ghost-on-olive{background:rgba(255,255,255,.16);border-color:transparent;color:inherit}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

/* day timeline */
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:56px 1fr;gap:12px;padding-block:9px;border-top:1px dashed var(--line)}
.tl:first-child{border-top:0}
.tl time{font-family:var(--f-display);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.tl.past{opacity:.5}
.tl.cur time{color:var(--fig);font-weight:600}
.tl-t{font-weight:600}
.tl-d{font-size:13.5px;color:var(--muted)}

/* water */
.cups{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:10px}
.cup{aspect-ratio:3/4;max-width:100%;border:1.5px solid var(--line);border-radius:6px 6px 12px 12px;background:var(--sunk);position:relative;overflow:hidden;padding:0}
.cup::after{content:"";position:absolute;inset:auto 0 0 0;height:0;background:linear-gradient(var(--olive-soft),var(--olive));transition:height .35s}
.cup.on::after{height:82%}
.cup.on{border-color:var(--olive)}

/* checklist */
.checks{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:start;width:100%}
.chk .box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center;margin-top:2px}
.chk.on .box{background:var(--ok);border-color:var(--ok)}
.chk.on .box::after{content:"";width:10px;height:6px;border:2px solid var(--surface);border-top:0;border-inline-end:0;transform:rotate(-45deg) translateY(-1px)}
.chk.on .t{text-decoration:line-through;color:var(--muted)}
.chk .t{font-weight:500;font-size:14px}
.chk .d{font-size:12.5px;color:var(--muted)}

/* weekly quotas */
.quotas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.q{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.q .n{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.q .bar{height:5px;border-radius:9px;background:var(--sunk);overflow:hidden}
.q .bar i{display:block;height:100%;background:var(--olive);border-radius:9px}
.q.full .bar i{background:var(--warn)}
.q.over .bar i{background:var(--bad)}
.q .ctl{display:flex;gap:6px}
.q .ctl button{flex:1;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:2px 0;font-size:16px;line-height:1.4}

/* search */
.searchbox{position:relative}
.searchbox input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 46px 13px 14px;font-size:16px}
.searchbox input:focus{border-color:var(--olive);outline:none}
.searchbox svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--olive-ink)}
.res{display:flex;flex-direction:column;gap:8px}
.food{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.badge{font-size:12px;font-weight:600;border-radius:8px;padding:3px 9px;white-space:nowrap;font-family:var(--f-display)}
.b-yes{background:var(--ok-soft);color:var(--ok)}
.b-limit{background:var(--warn-soft);color:var(--warn)}
.b-no{background:var(--bad-soft);color:var(--bad)}
.b-info{background:var(--sunk);color:var(--muted)}
.food .nm{font-weight:600}
.food .nt{font-size:13px;color:var(--muted)}
.food .alt{font-size:13px;color:var(--olive);margin-top:2px}
.sec-t{font-family:var(--f-display);font-size:14px;color:var(--muted);margin-top:4px}

/* meals builder */
.meal{padding:0;overflow:hidden}
.meal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.meal-h h3{font-size:18px}
.meal-h .tm{font-family:var(--f-display);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.part{padding:12px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:28px 1fr;gap:10px}
.part:first-of-type{border-top:0}
.part .no{width:24px;height:24px;border-radius:50%;background:var(--fig-soft);color:var(--fig);font-family:var(--f-display);font-size:12px;display:grid;place-items:center;margin-top:2px}
.part .pt{font-weight:600;font-size:14px}
.part .pd{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.opt{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:5px 11px;font-size:13.5px;text-align:start}
.opt[aria-pressed="true"]{background:var(--olive-soft);border-color:var(--olive);color:var(--ink);font-weight:600}
.opt .lim{color:var(--warn);font-size:11.5px;font-weight:500}
.fixed{font-size:14px}

/* recipes */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.rc{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0;text-align:start;display:flex;flex-direction:column;overflow:hidden}
.rc .art{height:84px;display:grid;place-items:center;font-family:var(--f-display);font-size:30px;color:var(--fig);background:var(--fig-soft);position:relative}
.rc .art.o{background:var(--olive-soft);color:var(--olive)}
.rc .art canvas{position:absolute;inset:0;width:100%;height:100%}
.rc .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.rc .nm{font-weight:600;font-size:15px;line-height:1.45}
.rc .mt{font-size:12px;color:var(--muted)}
.ai{border:1.5px dashed var(--fig);background:var(--fig-soft)}
.ai textarea,.ai select,.field{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface)}
.ai textarea{min-height:64px;resize:vertical}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,11,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:22px}
.sheet ol,.sheet ul{padding-inline-start:20px;margin:6px 0}
.sheet li{margin-block:5px}
.ing li{list-style:none;margin-inline-start:-20px}
.ing label{display:flex;gap:8px;align-items:flex-start}
.ing input{margin-top:6px;accent-color:var(--olive)}
.rule{background:var(--olive-soft);border-radius:12px;padding:10px 12px;font-size:13.5px}
.warnbox{background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--ink)}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}

/* reminders */
.rem{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.rem:first-child{border-top:0}
.rem .nm{font-weight:600;font-size:14.5px}
.rem .ds{font-size:12.5px;color:var(--muted)}
.rem input[type=time]{border:1px solid var(--line);border-radius:9px;padding:5px 8px;background:var(--sunk);font-variant-numeric:tabular-nums}
.rem .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.sw{width:44px;height:26px;border-radius:99px;background:var(--line);border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:right .2s}
.sw[aria-checked="true"]{background:var(--olive)}
.sw[aria-checked="true"]::after{right:21px}
.link{font-size:12.5px;color:var(--olive);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:3px 9px;display:inline-flex;gap:5px;align-items:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);width:min(92vw,460px);display:flex;gap:12px;align-items:center}
.toast b{font-family:var(--f-display)}
.toast button{margin-inline-start:auto;background:var(--bg);color:var(--ink);border:0;border-radius:9px;padding:5px 12px;font-weight:600}

details.rules summary{cursor:pointer;font-family:var(--f-display);font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.rules summary::after{content:"+";color:var(--muted)}
details.rules[open] summary::after{content:"−"}
.rl{display:flex;flex-direction:column;gap:8px;margin-top:10px;font-size:14px}
.rl div{padding-inline-start:12px;border-inline-start:2px solid var(--olive-soft)}
.pause{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;background:var(--sunk);margin-top:10px;font-size:13.5px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" dir="rtl" lang="ar">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="13" rx="5.2" ry="7" fill="var(--olive-ink)" opacity=".95" transform="rotate(-28 12 13)"/><path d="M14.5 4.5c1.5-1.8 3.8-2.4 5.5-2" stroke="var(--olive-ink)" stroke-width="1.6" stroke-linecap="round"/></svg></div>
      <div><h1>مائدتي</h1><small id="today-lbl"></small></div>
    </div>
    <button class="iconbtn" id="theme-btn" aria-label="تبديل الوضع الليلي"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
  </header>
  <main id="main"></main>
</div>

<nav class="tabs" dir="rtl" aria-label="الأقسام"><div class="tabs-in" role="tablist" id="tabs"></div></nav>
<div id="overlay"></div>
<div id="toast-host"></div>

<script>
document.documentElement.lang='ar';document.documentElement.dir='rtl';

/* ============ DATA: the plan as written by the specialist ============ */
const SALAD={t:'سلطة',d:'سلطة خضروات + رشة ملح الهمالايا أو البحري + ملعقة صغيرة خل تفاح + ملعقة صغيرة زيت زيتون',fixed:true};
const OLIVE={t:'زيتون',d:'زيتون أخضر فلسطيني',fixed:true};
const WHEY={t:'بعد الوجبة بنصف ساعة',d:'مصل اللبن',fixed:true};
const MEALS=[
 {id:'breakfast',name:'الفطور',time:'08:00',parts:[
  {k:'fruit',t:'فاكهة',d:'قبل الوجبة بنصف ساعة — اختر واحد',opts:['منقوع العسل (ملعقة على كوب ماء دافئ)','منقوع التين المجفف','منقوع المشمش المجفف','عصير تفاح طازج (كوب)','مشروب دعم الغدة الكظرية','منقوع ٥ حبات زبيب أسود','حبة قراصيا (برقوق)']},
  {k:'salad',...SALAD},
  {k:'starch',t:'نشويات',d:'اختر واحد',opts:['خبز أو توست حبوب كاملة','خبز الرز','خبز الكينوا','خبز الذرة','خبز الحنطة السوداء','خبز البر','خبز الحنطة','خبز الشوفان']},
  {k:'main',t:'الطبق',d:'اختر واحد',opts:['فول','فاصوليا','لوبيا','زيتون أسود مهروس + خس أو خيار','جبن الكاجو','سبانخ','بذور الشيا مع الشوفان وحليب جوز الهند','فاصوليا سوداء','مربى بدون سكر','حمص','زعتر + زيت زيتون','جواكامولي','الفطر البني','زبدة بذر تباع الشمس','برجر نباتي','بيض عضوي|٣ مرات بالأسبوع كحد أقصى','ديك رومي طازج']},
  {k:'olive',...OLIVE},{k:'whey',...WHEY}]},
 {id:'snack1',name:'وجبة خفيفة ١',time:'10:30',parts:[
  {k:'snack',t:'وجبة خفيفة',d:'اختر واحد',opts:['سموذي بروتين بودر (بديل مصل اللبن)','ماء جوز الهند','شاي نبات القراص','شاي زعتر','كاكاو مر','بذر تباع الشمس','بندق','عصير جزر طازج + ملعقة صغيرة كركم','شاي أخضر|مرتين بالأسبوع']}]},
 {id:'lunch',name:'الغداء',time:'13:30',parts:[
  {k:'fruit',t:'قبل الغداء بنصف ساعة',d:'اختر واحد',opts:['منقوع اللبان المر|لمدة أسبوعين فقط','عنب','كيوي','توت أزرق أو أحمر','ثلاث حبات تمر','مانجا','رمان','أناناس']},
  {k:'salad',...SALAD},
  {k:'starch',t:'نشويات',d:'اختر واحد',opts:['برغل','فريكة','هريس','جريش','معكرونة حنطة أو قمح كامل','كينوا','رز أسمر','قرع (يقطين)','كوسا','معكرونة الرز أو الكينوا','بطاطس','جزر','بطاطا حلوة','نبات اليام','حبوب الدخن','زهرة']},
  {k:'protein',t:'بروتين',d:'اختر واحد',opts:['فول','فاصوليا','لوبيا','نخي (حمص حب)','عدس','لحم غنم (خروف)','تشريبة الكوارع|مرتين بالشهر','سلمون بحري عضوي (نرويجي)','سمك السيباس','فاصوليا سوداء','بط|مرة إلى مرتين بالشهر','كبدة عجل أو خروف|مرة بالشهر','برجر نباتي','دجاج|مرتين بالأسبوع كحد أقصى']},
  {k:'olive',...OLIVE}]},
 {id:'snack2',name:'وجبة خفيفة ٢',time:'16:30',parts:[

/* ============ STATE ============ */
const ENV=(window.MAIDATI&&window.MAIDATI.env)||'artifact';
const KEY='maidati.v1'+(ENV==='staging'?'-staging':'');
let S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
S=Object.assign({plan:{},water:{},supp:{},q:{},times:{},rem:{},favs:[],ai:[],pause:false,tab:'today',fired:{}},S||{});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const pad=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function wkey(d=new Date()){const t=new Date(d);t.setHours(0,0,0,0);t.setDate(t.getDate()-t.getDay());return 'w'+dkey(t)} // week starts Sunday
const mkey=(d=new Date())=>'m'+d.getFullYear()+pad(d.getMonth()+1);
const toMin=s=>{const[h,m]=s.split(':').map(Number);return h*60+m};
const fromMin=m=>{m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const ar=s=>String(s).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
function fmt12(t){let[h,m]=t.split(':').map(Number);const p=h<12?'ص':'م';h=h%12||12;return ar(h+':'+pad(m))+' '+p}
const mealTime=id=>S.times[id]||MEALS.find(m=>m.id===id).time;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function norm(s){return String(s).toLowerCase().replace(/[ً-ٰٟ]/g,'').replace(/[أإآا]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/^ال/,'').replace(/\s+ال/g,' ').trim()}

}

let lastQ='';
function allOptions(){
  const out=[];MEALS.forEach(m=>m.parts.forEach(p=>(p.opts||[]).forEach(o=>{const[n,lim]=o.split('|');out.push({n,lim,meal:m.name,part:p.t})})));return out;
}
const OPTS=allOptions();
function searchAll(q){
  const nq=norm(q);if(!nq)return null;
  const words=nq.split(/\s+/);
  const score=(hay)=>{hay=norm(hay);let s=0;for(const w of words){if(!w)continue;if(hay.includes(w))s+=w.length}return s};
  const foods=F.map(f=>{const hay=[f[0],...f[3].split(',')];let best=0;for(const h of hay){const nh=norm(h);if(nh===nq)best=Math.max(best,100);else if(nh.startsWith(nq))best=Math.max(best,60);else if(nh.includes(nq)||(nq.includes(nh)&&nh.length>2))best=Math.max(best,40)}return{f,s:best}}).filter(x=>x.s).sort((a,b)=>b.s-a.s).slice(0,6);
  const opts=OPTS.filter(o=>norm(o.n).includes(nq)).slice(0,8);
  const recs=[...R,...S.ai].map(r=>({r,s:score(r.n)*3+score(r.i.join(' '))})).filter(x=>x.s).sort((a,b)=>b.s-a.s).slice(0,6).map(x=>x.r);
  return{foods,opts,recs};
}

  const box=document.getElementById('results');if(!box)return;
  const r=searchAll(lastQ);
  if(!r){box.innerHTML=`<p class="small muted" style="text-align:center;margin:8px 0">اكتب اسم أي طعام لتعرف حكمه في نظامك، وأين يدخل، ووصفاته.</p>`;return}
  let h='';
  if(r.foods.length){h+=`<div class="sec-t">الحكم في نظامك</div>`+r.foods.map(({f})=>`<div class="food"><span class="badge b-${f[1]}">${STL[f[1]]}</span><div><div class="nm">${esc(f[0])}</div><div class="nt">${esc(f[2])}</div>${f[4]?`<div class="alt">البديل: ${esc(f[4])}</div>`:''}</div></div>`).join('')}
  if(r.opts.length){h+=`<div class="sec-t">موجود في وجباتك</div>`+r.opts.map(o=>`<div class="food"><span class="badge ${o.lim?'b-limit':'b-yes'}">${o.lim?'باعتدال':'مسموح'}</span><div><div class="nm">${esc(o.n)}</div><div class="nt">${esc(o.meal)} ← ${esc(o.part)}${o.lim?' · '+esc(o.lim):''}</div></div></div>`).join('')}

function recMeal(id){return {breakfast:'فطور',snack1:'خفيفة ١',lunch:'غداء',snack2:'خفيفة ٢',dinner:'عشاء'}[id]||''}
function recCard(r){const olive=['lunch','snack1'].includes(r.m);return `<button class="rc" data-act="recipe" data-id="${esc(r.id)}"><div class="art ${olive?'o':''}">${esc(r.g||r.n[0])}</div><div class="bd"><div class="nm">${esc(r.n)}</div><div class="mt">${recMeal(r.m)} · ${ar(r.t)} دقيقة${r.ai?' · من Claude':''}</div></div></button>`}

function randOf(a){return a[Math.floor(Math.random()*a.length)]}
function autoPick(mealId,force){
  const meal=MEALS.find(m=>m.id===mealId),tp=todayPlan();tp[mealId]=tp[mealId]||{};
  meal.parts.forEach(p=>{if(!p.opts)return;if(!force&&tp[mealId][p.k])return;
    // respect quotas: skip options whose quota is used up
    const ok=p.opts.filter(o=>{const n=o.split('|')[0];const q=quotaFor(n);return !q||quotaVal(q)<q.max});
    tp[mealId][p.k]=randOf(ok.length?ok:p.opts)});
  save();
}
function quotaFor(name){if(/بيض/.test(name))return QUOTAS.find(q=>q.id==='egg');if(/دجاج/.test(name))return QUOTAS.find(q=>q.id==='chicken');if(/شاي أخضر/.test(name))return QUOTAS.find(q=>q.id==='green');if(/^بط/.test(name))return QUOTAS.find(q=>q.id==='duck');if(/كبدة/.test(name))return QUOTAS.find(q=>q.id==='liver');if(/كوارع/.test(name))return QUOTAS.find(q=>q.id==='trotter');if(/ميرامية/.test(name))return QUOTAS.find(q=>q.id==='herbtea');return null}
function nextMealId(){const nm=new Date().getHours()*60+new Date().getMinutes();const m=MEALS.find(m=>toMin(mealTime(m.id))>=nm-20);return m?m.id:'breakfast'}

}

    <div class="warnbox" style="margin-top:10px">${esc(COOK)}${r.q?' سجّل هذه الوجبة في عدّاد الحصص.':''}</div>
    <div class="row" style="margin-top:14px">
      <a class="btn fig" href="${yt}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="m10 9 5 3-5 3z"/></svg>فيديو الطريقة على يوتيوب</a>
      <button class="btn" data-act="fav" data-id="${esc(r.id)}">${fav?'إزالة من المفضلة':'أضف للمفضلة'}</button>
      ${r.q?`<button class="btn" data-act="q" data-id="${r.q}" data-d="1">سجّلتها اليوم</button>`:''}
      ${r.ai?`<button class="btn" data-act="delai" data-id="${esc(r.id)}">حذف</button>`:''}
    </div>
    <p class="small muted" style="margin-top:8px">فيديوهات يوتيوب عامة: إن ظهر فيها زبدة أو حليب أو جبن أو قدر ألمنيوم فاستبدلها بما في المكونات أعلاه.</p>`);
}

  o.innerHTML=`<div class="scrim" data-act="close"><div class="sheet" dir="rtl" role="dialog" aria-modal="true"><div class="grab"></div>${html}<div style="margin-top:14px"><button class="btn" data-act="close" style="width:100%;justify-content:center">إغلاق</button></div></div></div>`;

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ============ CLAUDE (optional — sample capability) ============ */
const RULES=`قواعد نظام غذائي علاجي (أيض بطيء، مبني على تحليل معادن الشعر):
- الدهن الوحيد المسموح: زيت الزيتون. ممنوع: زبدة، سمن، كريمة، زيت جوز الهند، زبدة المكسرات، الصلصات الجاهزة.
- ممنوع: الحليب ومنتجات الألبان والأجبان واللبنة (مصل اللبن مسموح)، الصويا، البروكلي، الباذنجان، الخروب، السردين، التونة، السلامي واللحوم المصنعة، القهوة، الشاي الأحمر، البابونج، اليانسون، الكافيين، الغازيات، العصائر المعلبة، السكر الأبيض، الرز والخبز والطحين الأبيض، المحليات الصناعية، المواد الحافظة، مكعبات المرق وE621، البيكنج باودر (استخدم كريم التارتار + بيكربونات)، عرق السوس، البرسيم.
- قلّل: الطحينة والسمسم.
- محدود: دجاج مرتين/أسبوع، بيض عضوي 3 مرات/أسبوع، بط 1-2/شهر، كبدة مرة/شهر، شاي أخضر مرتين/أسبوع.
- السكر المسموح: سكر القصب أو ستيفيا باعتدال. العسل والتمر مسموحان.
- مسموح ومفضل: لحم غنم، سلمون، سيباس، ديك رومي، فول، فاصوليا، لوبيا، نخي، عدس، فاصوليا سوداء، برغل، فريكة، هريس، جريش، كينوا، رز أسمر، شوفان، دخن، حنطة سوداء، يقطين، كوسا، بطاطس، جزر، بطاطا حلوة، زهرة، يام، ذرة، فطر بني، سبانخ، أفوكادو، بذر يقطين، بذور شيا، لوز، كاجو، بندق، كاكاو مر، حليب جوز الهند/اللوز، خضار السلطة، فواكه طازجة، بصل وثوم مطبوخان، كزبرة، بهارات (زنجبيل، هيل، كركم، كمون، قرفة، قرنفل).
- الطبخ في ستانلس أو فخار أو زجاج؛ لا ألمنيوم ولا حديد ولا ورق ألمنيوم.
- هيكل الوجبات: الفطور = فاكهة/منقوع قبله بنصف ساعة + سلطة + خبز حبوب كاملة + طبق نباتي (أو بيض/ديك رومي). الغداء = فاكهة قبله + سلطة + نشويات + بروتين. العشاء = شوربة خضار مع بصل وثوم أو كزبرة. الوجبات الخفيفة بسيطة.`;
async function initSample(){
  try{if(!window.claude)return;const s=await window.claude.use('sample');if(s){sampleFn=s;const b=document.getElementById('aibox');if(b)b.hidden=false;const a=document.getElementById('askbox');if(a&&lastQ)mountAsk(lastQ)}}catch(e){}
}
const ERR={not_granted:'لم يُسمح بالاتصال بـClaude من هذه الصفحة.',rate_limited:'طلبات كثيرة، انتظر دقيقة ثم جرّب.',cancelled:'أُلغي الطلب.'};
async function aiRecipe(){
  const out=document.getElementById('ai-out'),btn=document.getElementById('ai-go');
  const want=document.getElementById('ai-in').value.trim(),meal=document.getElementById('ai-meal').value;
  if(!want){out.textContent='اكتب ما عندك أو ما تشتهيه أولاً.';return}
  btn.disabled=true;out.textContent='يكتب Claude الوصفة… قد يستغرق ذلك نصف دقيقة.';
  try{
    const j=await sampleFn.json(`${RULES}

الطلب: ${want}
${meal?'الوجبة: '+recMeal(meal):''}
اكتب وصفة عربية واحدة سهلة تلتزم بكل القواعد أعلاه (إن طلب الشخص مكوناً ممنوعاً فاستبدله واذكر ذلك في why).
أعد JSON فقط بهذا الشكل:
{"n":"اسم الطبق","m":"breakfast|lunch|dinner|snack1|snack2","t":30,"s":2,"i":["مكون بالكمية"],"st":["خطوة"],"w":"جملة قصيرة: لماذا تناسب النظام وما الذي استُبدل"}`,{modelTier:'default'});
    if(!j||!j.n||!Array.isArray(j.i)||!Array.isArray(j.st))throw{code:'bad'};
    const r={id:'ai'+Date.now(),n:String(j.n),m:['breakfast','lunch','dinner','snack1','snack2'].includes(j.m)?j.m:(meal||'lunch'),t:Number(j.t)||30,s:Number(j.s)||2,i:j.i.map(String),st:j.st.map(String),w:String(j.w||''),ai:true};
    S.ai.unshift(r);S.ai=S.ai.slice(0,30);save();vRecipes();openRecipe(r.id);
  }catch(e){out.textContent=ERR[e&&e.code]||'تعذّر الحصول على الوصفة الآن. جرّب بصياغة أخرى.';btn.disabled=false}
}
function mountAsk(q){
  const box=document.getElementById('askbox');if(!box||!sampleFn)return;
  box.innerHTML=`<button class="btn fig" style="margin-top:8px" id="ask-go">اسأل Claude عن "${esc(q)}"</button><div id="ask-out" class="small" style="margin-top:6px"></div>`;
  document.getElementById('ask-go').onclick=async()=>{
    const out=document.getElementById('ask-out');out.textContent='يراجع Claude قواعد النظام…';
    try{const j=await sampleFn.json(`${RULES}\n\nهل "${q}" مناسب لهذا النظام؟ أعد JSON فقط: {"status":"yes|limit|no","reason":"سبب في جملة","alt":"بديل من المسموحات أو فارغ"}`,{modelTier:'quick'});
      const st=['yes','limit','no'].includes(j.status)?j.status:'limit';
      out.innerHTML=`<span class="badge b-${st}">${STL[st]}</span> ${esc(j.reason||'')}${j.alt?`<div class="alt">البديل: ${esc(j.alt)}</div>`:''}<div class="muted" style="margin-top:4px">رأي تقديري؛ عند الشك اسأل الأخصائية.</div>`;
    }catch(e){out.textContent=ERR[e&&e.code]||'تعذّر السؤال الآن.'}
  };
}

/* ============ REMINDERS ============ */
const REMS=[
 {id:'k2',t:'مكمل K2 + فاكهة الفطور',d:'قبل الفطور بنصف ساعة',base:'breakfast',off:-30,supp:1},
 {id:'breakfast',t:'الفطور',d:'سلطة ← نشويات ← الطبق',base:'breakfast',off:0},
 {id:'whey1',t:'مصل اللبن + Pickleball Cocktail',d:'بعد الفطور بنصف ساعة',base:'breakfast',off:30},
 {id:'snack1',t:'وجبة خفيفة ١',d:'',base:'snack1',off:0},
 {id:'lfruit',t:'فاكهة ما قبل الغداء',d:'قبل الغداء بنصف ساعة',base:'lunch',off:-30},
 {id:'lunch',t:'الغداء + Betaine HCL',d:'سلطة ← نشويات ← بروتين',base:'lunch',off:0},
 {id:'snack2',t:'وجبة خفيفة ٢',d:'',base:'snack2',off:0},
 {id:'mag',t:'مكمل المغنيسيوم',d:'قبل العشاء بنصف ساعة',base:'dinner',off:-30,supp:1},
 {id:'dinner',t:'العشاء',d:'شوربة مع بصل وثوم أو كزبرة',base:'dinner',off:0},
 {id:'whey2',t:'مصل اللبن',d:'بعد العشاء بنصف ساعة',base:'dinner',off:30},
 {id:'soak',t:'نقع القدم بملح إبسوم',d:'الأحد والثلاثاء والخميس',base:'soak',off:0,days:'SU,TU,TH'},
 {id:'water',t:'اشرب كوب ماء',d:'كل ساعتين من ٩ صباحاً إلى ٩ مساءً',water:1},
];
const remTime=r=>r.water?null:fromMin(toMin(r.base==='soak'?(S.times.soak||'21:30'):mealTime(r.base))+r.off);
const remOn=r=>S.rem[r.id]!==false;
function gcal(r){
  const t=remTime(r);const d=new Date();const[h,m]=t.split(':').map(Number);d.setHours(h,m,0,0);
  const e=new Date(d.getTime()+15*60000);
  const f=x=>x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate())+'T'+pad(x.getHours())+pad(x.getMinutes())+'00';
  const rr=r.days?`RRULE:FREQ=WEEKLY;BYDAY=${r.days}`:'RRULE:FREQ=DAILY';
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'Asia/Riyadh';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('مائدتي: '+r.t)+'&details='+encodeURIComponent(r.d||'حسب نظامك الغذائي')+'&dates='+f(d)+'/'+f(e)+'&recur='+encodeURIComponent(rr)+'&ctz='+encodeURIComponent(tz);
}
function vRemind(){
  const perm=('Notification' in window)?Notification.permission:'unsupported';
  main.innerHTML=`<div class="view">
    <section class="card">
      <h3 style="font-size:17px">مواعيد وجباتك</h3>
      <p class="small muted" style="margin:.2em 0 .6em">غيّرها لتناسب يومك، وستتحرك تذكيرات الفاكهة والمكملات ومصل اللبن معها تلقائياً.</p>
      <div class="quotas">${[...MEALS.map(m=>[m.id,m.name]),['soak','نقع القدم']].map(([id,n])=>`<label class="q"><span class="small">${n}</span><input type="time" id="t-${id}" data-act="time" data-id="${id}" value="${id==='soak'?(S.times.soak||'21:30'):mealTime(id)}" class="field"></label>`).join('')}</div>
    </section>
    <section class="card">
      <div class="spread"><h3 style="font-size:17px">التذكيرات</h3>
      ${perm==='default'?`<button class="btn primary" data-act="notif">فعّل إشعارات المتصفح</button>`:perm==='granted'?'<span class="badge b-yes">الإشعارات مفعّلة</span>':''}</div>
      <p class="small muted" style="margin:.3em 0 .4em">تظهر التذكيرات هنا مع صوت تنبيه ما دامت الصفحة مفتوحة. وللتذكير على الجوال حتى والصفحة مغلقة، اضغط <b>أضف لتقويم Google</b> لكل موعد: يُنشأ حدث يتكرر يومياً بتنبيه.</p>
      <div>${REMS.map(r=>`<div class="rem"><div><div class="nm">${esc(r.t)}</div><div class="ds">${r.water?esc(r.d):fmt12(remTime(r))+(r.d?' · '+esc(r.d):'')}${r.supp&&S.pause?' · موقوف (المكملات متوقفة)':''}</div></div>
        <button class="sw" role="switch" aria-checked="${remOn(r)}" data-act="rem" data-id="${r.id}" aria-label="تفعيل ${esc(r.t)}"></button>
        ${r.water?'':`<div class="acts"><a class="link" href="${gcal(r)}" target="_blank" rel="noopener">أضف لتقويم Google</a></div>`}</div>`).join('')}</div>
      <div class="row" style="margin-top:10px"><button class="btn" data-act="testrem">جرّب التنبيه</button></div>
    </section>
  </div>`;
}
/* reminder engine */
let audioCtx=null;
document.addEventListener('pointerdown',()=>{try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}},{once:true});
function chime(){try{if(!audioCtx)return;const t=audioCtx.currentTime;[659,880].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(0,t+i*.18);g.gain.linearRampToValueAtTime(.18,t+i*.18+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.18+.6);o.connect(g).connect(audioCtx.destination);o.start(t+i*.18);o.stop(t+i*.18+.7)})}catch(e){}}
function toast(title,body){
  const h=document.getElementById('toast-host');
  h.innerHTML=`<div class="toast" dir="rtl" role="status"><div><b>${esc(title)}</b>${body?`<div class="small" style="opacity:.8">${esc(body)}</div>`:''}</div><button data-act="closetoast">تم</button></div>`;
  chime();
  try{if('Notification' in window&&Notification.permission==='granted'){const o={body:body||'',icon:'icon-192.png',badge:'icon-192.png',tag:'maidati'};if(navigator.serviceWorker&&navigator.serviceWorker.controller)navigator.serviceWorker.ready.then(r=>r.showNotification('مائدتي: '+title,o));else new Notification('مائدتي: '+title,o)}}catch(e){}
  clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML='',60000);
}
function tick(){
  const now=new Date(),hm=pad(now.getHours())+':'+pad(now.getMinutes()),day=['SU','MO','TU','WE','TH','FR','SA'][now.getDay()];
  const fk=dkey();S.fired[fk]=S.fired[fk]||{};
  for(const r of REMS){
    if(!remOn(r))continue;if(r.supp&&S.pause)continue;if(r.days&&!r.days.includes(day))continue;
    let hit=false;
    if(r.water){const h=now.getHours();hit=now.getMinutes()===0&&h>=9&&h<=21&&h%2===1;}
    else hit=remTime(r)===hm;
    const id=r.id+hm;
    if(hit&&!S.fired[fk][id]){S.fired[fk][id]=1;save();
      let body=r.d;const meal=MEALS.find(m=>m.id===r.id);
      if(meal){body=mealSummary(meal).filter(x=>!/لم تختر/.test(x.v)).map(x=>x.v).slice(0,3).join(' · ')||r.d}
      toast(r.t,body);if(S.tab==='today')vToday();}
  }
  // keep only today's fired log
  for(const k in S.fired)if(k!==fk)delete S.fired[k];
}
setInterval(tick,20000);

/* ============ EVENTS ============ */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='close'){if(e.target===b||b.tagName==='BUTTON')closeSheet();return}
  if(a==='closetoast'){document.getElementById('toast-host').innerHTML='';return}
  if(a==='water'){const n=+b.dataset.n,cur=S.water[dkey()]||0;S.water[dkey()]=cur===n?n-1:n;save();vToday();return}
  if(a==='supp'){const s=S.supp[dkey()]=S.supp[dkey()]||{};s[b.dataset.id]=!s[b.dataset.id];save();vToday();return}
  if(a==='pause'){S.pause=!S.pause;save();render();return}
  if(a==='q'){const q=QUOTAS.find(x=>x.id===b.dataset.id);const k=q.per==='w'?wkey():mkey();S.q[k]=S.q[k]||{};S.q[k][q.id]=Math.max(0,(S.q[k][q.id]||0)+(+b.dataset.d));save();
    if(document.querySelector('.sheet')){b.textContent='سُجّلت ✓';b.disabled=true}else vToday();return}
  if(a==='pick'){autoPick(b.dataset.meal,true);vToday();return}
  if(a==='goplan'){go('plan');return}
  if(a==='pickall'){MEALS.forEach(m=>autoPick(m.id,true));vPlan();return}
  if(a==='opt'){const tp=todayPlan();tp[b.dataset.meal]=tp[b.dataset.meal]||{};const v=b.dataset.v;tp[b.dataset.meal][b.dataset.k]=tp[b.dataset.meal][b.dataset.k]===v?undefined:v;save();
    b.parentElement.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===tp[b.dataset.meal][b.dataset.k]));return}
  if(a==='whatnow'){whatNow();return}
  if(a==='recipe'){openRecipe(b.dataset.id);return}
  if(a==='rf'){rFilter=b.dataset.k;vRecipes();return}
  if(a==='fav'){const id=b.dataset.id,i=S.favs.indexOf(id);i<0?S.favs.push(id):S.favs.splice(i,1);save();openRecipe(id);if(S.tab==='recipes')vRecipes();return}
  if(a==='delai'){S.ai=S.ai.filter(r=>r.id!==b.dataset.id);save();closeSheet();vRecipes();return}
  if(a==='rem'){S.rem[b.dataset.id]=!remOn({id:b.dataset.id});save();b.setAttribute('aria-checked',remOn({id:b.dataset.id}));return}
  if(a==='notif'){try{Notification.requestPermission().then(()=>vRemind()).catch(()=>vRemind())}catch(err){vRemind()}return}
  if(a==='testrem'){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)()}catch(err){}toast('هكذا يبدو التذكير','سيظهر في موعد كل وجبة ومكمل');return}
});
document.addEventListener('change',e=>{
  const t=e.target;if(t.dataset&&t.dataset.act==='time'&&t.value){S.times[t.dataset.id]=t.value;save();vRemind()}
});

render();
setTimeout(initSample,0);
setInterval(()=>{if(S.tab==='today'&&!document.querySelector('.sheet'))vToday()},60000);
</script>
